name: Build Windows

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Configure
        run: cmake -S . -B build -A x64

      - name: Build
        shell: pwsh
        run: |
          cmake --build build --config Release --parallel 2>&1 | Tee-Object -FilePath build.log
          if ($LASTEXITCODE -ne 0) {
            # Surface compiler errors as annotations, so they show without the raw log.
            Select-String -Path build.log -Pattern ': (fatal )?error ' | Select-Object -First 30 | ForEach-Object { Write-Output "::error::$($_.Line.Trim())" }
            exit 1
          }

      - name: Package
        shell: pwsh
        run: |
          $out = "dist/Riddim Machine Windows"
          New-Item -ItemType Directory -Force "$out/Standalone", "$out/VST3" | Out-Null
          foreach ($t in "RiddimMachine", "RiddimForge", "RiddimMachineFX") {
            Copy-Item "build/${t}_artefacts/Release/Standalone/*.exe" "$out/Standalone/"
            Copy-Item -Recurse "build/${t}_artefacts/Release/VST3/*.vst3" "$out/VST3/"
          }
          Copy-Item "packaging/windows/README.txt" "$out/"

      - uses: actions/upload-artifact@v5
        with:
          name: RiddimMachine-Windows
          path: dist/
